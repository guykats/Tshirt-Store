name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pull latest code, install PHP dependencies, and migrate
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Maintenance mode brackets the riskiest part of the deploy (code swap +
            # migrations) so requests don't land mid-migration against a half-updated
            # schema. The trap guarantees `up` runs even if a step below fails, so a
            # bad migration can't leave the site down indefinitely — it can still leave
            # the schema in a partial state that needs manual review, but the site
            # itself won't hang in maintenance mode waiting on a step that never ran.
            php artisan down --render="errors::503" --retry=30 || true
            trap 'php artisan up || true' EXIT

            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction

            # Clear (not cache) config before migrating, so migrations run against
            # whatever .env actually says now rather than a stale cache from the
            # previous deploy that may predate a config/env change this deploy needs.
            php artisan config:clear
            php artisan migrate --force
            php artisan storage:link || true

      - name: Upload built frontend assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/*"
          target: "${{ secrets.DEPLOY_PATH }}/public/build"
          strip_components: 2

      - name: Recache config, routes and views
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Idempotent: strips any pre-existing schedule:run line before re-adding it,
            # so re-running this step (or re-deploying) never duplicates the crontab entry.
            # Laravel's own scheduler (bootstrap/app.php's withSchedule()) does nothing in
            # production without this - something has to invoke `schedule:run` every
            # minute for withSchedule()'s dailyAt(...) jobs to ever actually fire. This was
            # long-blocked (task 65/67/69/duplicate-cron-wiring) because no autonomous
            # run's installation token can push a change to .github/workflows/*.yml -
            # landing here now via a human-authenticated push.
            #
            # Guarded, not assumed: the first attempt at this (2026-09-23) broke the whole
            # deploy - `bash: crontab: command not found` (exit 127) under `set -e` failed
            # this entire step, even though config/route/view caching above had already
            # succeeded. This host's plan apparently doesn't expose a raw `crontab` binary
            # over SSH (common on shared/managed hosting, where cron is configured through
            # the panel's own UI instead) - `command -v` first so a future deploy on a host
            # that genuinely lacks it degrades to a clear log line, not a failed deploy.
            if command -v crontab >/dev/null 2>&1; then
              (crontab -l 2>/dev/null | grep -v 'artisan schedule:run'; echo "* * * * * cd ${{ secrets.DEPLOY_PATH }} && php artisan schedule:run >> /dev/null 2>&1") | crontab -
            else
              echo "crontab not available on this host - Laravel's scheduler needs to be wired up through the hosting panel's own Cron Jobs UI instead (e.g. Hostinger hPanel), pointed at: cd ${{ secrets.DEPLOY_PATH }} && php artisan schedule:run"
            fi
