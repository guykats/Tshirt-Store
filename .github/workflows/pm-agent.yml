name: PM Agent (autonomous)

# Runs unattended on a schedule, independent of any interactive session — it
# syncs with the live project_tasks/epics board and keeps shipping real,
# verified progress per CLAUDE.md. See docs/PROJECT-HISTORY.md for why this
# board-driven workflow exists at all.

on:
  schedule:
    # Runs finish in ~3-13 min, well under the old 30-min cadence, so most of
    # each window was idle wait rather than work. concurrency below already
    # serializes runs (cancel-in-progress: false), so a shorter interval just
    # means the next run starts sooner after the previous one finishes -
    # never two running at once, never wasted work.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: pm-agent
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  pm-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure local environment (SQLite, no real secrets needed)
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite
          php artisan key:generate

      # Builds this run's local board replica from git-tracked migration
      # history alone — it has no connection to production's real database,
      # so on its own it has no idea what the owner has approved via the live
      # dashboard. The next step corrects exactly that before Claude looks at
      # anything.
      - name: Migrate and seed the local board replica
        run: php artisan migrate:fresh --seed --force

      # Fetches the real, live set of approved_for_dev todo task titles from
      # production over HTTPS and overwrites this run's local replica to
      # match, so the PM Agent's task-selection below reflects real owner
      # approvals instead of only what migration history happens to encode.
      # See PmAgentAutomationController::approvedTodoTitles and
      # app/Console/Commands/SyncApprovedTaskTitles.php. Requires the
      # PM_AGENT_BOARD_TOKEN repo secret (same value as production's .env) —
      # harmless no-op, leaving migration-replayed approvals as-is, if it
      # isn't set yet. continue-on-error because a transient network failure
      # reaching production (already hit once: cURL error 28, connect
      # timeout) must never abort the whole run before Claude even starts -
      # the command itself already catches this and exits 0, but this is
      # defense in depth against anything it doesn't.
      - name: Sync real approved-task titles from production
        continue-on-error: true
        env:
          PM_AGENT_BOARD_TOKEN: ${{ secrets.PM_AGENT_BOARD_TOKEN }}
        run: php artisan pm-agent:sync-approved-titles

      # Same fix as above, for epics: approve/reject/delay on the live Epics
      # tab writes straight to production, invisible to this replay - and
      # epics can be created live too (VisionerChatController::proposeEpic),
      # with no migration at all, so a replay can be missing rows entirely.
      # See PmAgentAutomationController::epicDecisions and
      # app/Console/Commands/SyncEpicDecisions.php. Same continue-on-error
      # reasoning as the step above.
      - name: Sync real epic decisions from production
        continue-on-error: true
        env:
          PM_AGENT_BOARD_TOKEN: ${{ secrets.PM_AGENT_BOARD_TOKEN }}
        run: php artisan pm-agent:sync-epic-decisions

      - name: Configure git identity for autonomous commits
        run: |
          git config user.name "PM Agent"
          git config user.email "pm-agent@users.noreply.github.com"

      # Same production-visibility gap as above, but for the automation
      # toggle itself: disables the pm-agent workflow server-side if nothing
      # is approved to build; see PmAgentAutomationController::disableIfIdle.
      # Same PM_AGENT_BOARD_TOKEN secret, same harmless no-op if unset.
      # --max-time/--retry mirror the Http::timeout(10) + catch pattern
      # already used in the sync commands above - run #148 hit the exact
      # same transient cURL error 28 (connect timeout) here, but this bare
      # curl call had no timeout of its own and hung for 4m31s before
      # failing, silently skipping the idle check for that entire run
      # instead of failing fast and letting the next scheduled run retry.
      - name: Disable PM Agent automation if nothing is approved to build
        continue-on-error: true
        run: |
          curl -s -X POST \
            --max-time 15 --retry 2 --retry-delay 2 --retry-connrefused \
            -H "X-PM-Agent-Token: ${{ secrets.PM_AGENT_BOARD_TOKEN }}" \
            https://store.guykats.com/api/pm-agent-automation/disable-if-idle

      - name: Run PM Agent
        uses: anthropics/claude-code-action@v1
        with:
          # Uses the owner's Claude subscription (via `claude setup-token`) instead of
          # metered API billing. github_token must be passed explicitly alongside
          # claude_code_oauth_token, or the action falls back to GitHub App auth and
          # fails - see https://github.com/anthropics/claude-code-action/issues/676.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Raised from 100 - runs #129 and #130 both hit error_max_turns at
          # exactly 101 turns without a clean completion (verified via
          # show_full_output: true on a diagnostic run). Cost isn't the
          # constraint on a subscription-authenticated run; a stuck run
          # burning its full budget without shipping anything is the actual
          # waste. More headroom, paired with the turn-budget discipline added
          # to the prompt below, is the fix.
          claude_args: >-
            --permission-mode acceptEdits
            --max-turns 150
            --allowedTools "Read,Write,Edit,Bash,Grep,Glob,WebSearch"
          prompt: |
            You are running unattended as this project's PM, triggered on a 30-minute
            schedule with no human present. Read CLAUDE.md first and follow it exactly —
            the standing operating agreement, the hard-won conventions, and the
            verification bar all apply to this run exactly as they would to an
            interactive session.

            This run:

            1. Check the live state of the `project_tasks` and `epics` tables — this
               run's local SQLite has already been migrated, seeded, AND (via the
               "Sync real approved-task titles from production" and "Sync real epic
               decisions from production" steps, before you started) reconciled so
               both tables match production's REAL live state, not just migration
               history: `project_tasks.approved_for_dev` reflects real "Approve for
               development" clicks, and `epics` reflects real approve/reject/delay
               decisions (including epics that only exist live, proposed via the
               `/dashboard/chat` Visioner conversation, which have no migration at
               all). Just query the tables directly; don't re-run
               `php artisan migrate:fresh --seed --force` for this purpose — that
               would wipe both syncs you were just given, since a fresh replay only
               ever reflects migration history, never a live dashboard click. (Running
               `migrate:fresh --seed --force` again LATER, as part of the standard
               verification bar on the actual code you write, is still correct and
               required — by then you've already decided what to build, so it no
               longer matters that it discards the sync.)
            2. Pick the single highest-value next action from `project_tasks` where
               `status = 'todo' AND approved_for_dev = 1` and actually ship it, following
               the `ship-project-task` skill (or `propose-epics` if the proposed-epics
               queue is thin). Don't just report — do real work: code, tests, docs, or
               board bookkeeping, verified per CLAUDE.md's bar, committed and pushed
               directly to `main`. The owner approves individual tasks for development
               from the board UI (`/dashboard/progress`), except tasks broken out of an
               approved epic, which are pre-approved per step 3 below — a `todo` task
               with `approved_for_dev = 0` is NOT yet cleared to build; never start on
               one, no matter how obviously good it looks. Only move on to a SECOND approved
               task after the first reaches a real, complete resolution — either shipped
               (verified, committed, pushed, marked `done`) or correctly `blocked` with a
               clear `blocked_reason` per step 6 — AND you're confident you have enough
               turns left to finish the next one just as completely. Blocking a task you
               genuinely cannot do is a fast, complete resolution, not a half-finished
               attempt — it does NOT count as "starting work you're not sure you can
               finish," so don't let this caution talk you into ending the run empty-handed
               after a quick, correct block when turn budget and an independent approved
               task (one that doesn't depend on the blocked one) are both still available.
               A full implement-and-ship cycle reliably costs several dozen turns; a
               correct block costs far fewer. What this caution actually guards against is
               starting REAL IMPLEMENTATION on a second task without finishing it, or
               burning most of the run "investigating" without ever landing on shipped-or-
               blocked for anything — not triaging one blocked task and then doing real,
               complete work on the next one.
            3. If an epic is `approved` with zero linked `project_tasks`, break it into
               concrete tasks now (set `epic_id` on each) — that's the PM's job. Set
               `approved_for_dev = 1` on each of these tasks — by explicit owner
               request, approving the epic itself already is the decision to build it
               out, so epic-derived tasks are pre-approved and will be picked up by
               step 2 on a later run like any other approved task. This is the one
               exception to the approval gate; ad hoc backlog tasks seeded in step 4
               below still default to unapproved. IMPORTANT: if
               that epic's id is only in this run's local database because the sync
               step inserted it (i.e. `grep -r "insert.*epics" database/migrations`
               finds no migration for its exact title — it was proposed live via chat,
               never migration-seeded), you must FIRST write and push a migration that
               inserts the epic itself (mirroring its real title/description/status
               from the synced local row) so it has a real, git-tracked id, THEN write
               the `project_tasks` migrations referencing that same migration-created
               epic's id. Never reference this run's local sync-only id in a pushed
               migration — it only exists for this one CI run and won't exist on the
               next fresh replay, which would leave a dangling `epic_id` reference.
            4. If there is no approved `todo` task to work on, don't sit idle: seed more
               real, concrete candidate items (also left unapproved, pending the owner's
               review) so there's always something ready to be approved — but do not
               start building any of them yourself this run. This project's standing
               rule is a continuously non-empty backlog, never idle, while still
               respecting the human approval gate on what actually gets built.
            5. PayPal and SMTP real credentials remain intentionally deferred — never
               block on them.
            6. If something genuinely needs a human decision (ambiguous priority,
               unusually risky, or a task with no safe path forward), mark it `blocked`
               with a clear `blocked_reason` on the board instead of guessing. Never spend
               real turns investigating something and then end the run with nothing
               pushed and no `blocked_reason` explaining why — that's a silent no-op the
               owner has no way to see or act on. If the task turns out to need a tool or
               capability this run doesn't have (see CLAUDE.md's "no WebFetch" gotcha for
               the exact precedent), `blocked` with that reason is correct, not a stall.
               Then check the board again: if turn budget allows, pick up the next
               highest-value approved task that doesn't depend on the one you just
               blocked and actually ship it, per step 2's carve-out — don't let one
               correctly-blocked task end the run empty-handed when independent approved
               work and turns are both still available.
            7. If you discover a durable, repeatable gap this run — not just "this one
               task turned out hard," but something that would trip up a *future* run the
               same way (a missing tool capability, a false assumption baked into
               CLAUDE.md/a skill/an epic, a process step that doesn't work as documented)
               — write it into CLAUDE.md as part of this same run, committed and pushed,
               the same way the turn-budget lesson from runs #129/#130 was captured there.
               Don't just route around it silently; future runs (and interactive sessions)
               read CLAUDE.md first and have no other way to learn what this run learned.

            Turn-budget discipline matters more than throughput: a run that ships ONE
            task completely (implemented, fully verified, committed, pushed, marked
            `done` with a real commit sha) is a full success — it does not need to
            squeeze in a second or third task to be worthwhile. A run that instead
            starts a second or third task and then hits the turn cap mid-implementation,
            mid-verification, or mid-push is a failure: it wastes the entire run's cost
            and can leave a task stuck half-built with nothing shippable to show for it.
            When genuinely unsure whether you have enough turns left to finish something
            else cleanly, stop the run rather than gamble. Every change must still pass
            the full verification bar in CLAUDE.md before you call it done.
